<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SimplePAM Console</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
    <style>
        body { background-color: #1e1e1e; color: #fff; font-family: monospace; padding: 20px; }
        .hidden { display: none !important; }
        
        #login-screen, #server-screen { max-width: 400px; margin: 50px auto; text-align: center; }
        input { padding: 10px; margin: 10px; width: 80%; background: #333; color: white; border: 1px solid #555; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }

        .server-btn { display: block; width: 100%; margin: 10px 0; background: #28a745; }
        
        #terminal-container { width: 100%; height: 90vh; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>SimplePAM Login</h2>
        <input type="text" id="username" placeholder="Username" />
        <input type="password" id="password" placeholder="Password" />
        <button onclick="handleLogin()">Login</button>
        <p id="error-msg" style="color: red;"></p>
    </div>

    <div id="server-screen" class="hidden">
        <h2>Select Server</h2>
        <div id="server-list"></div>
    </div>

    <div id="terminal-screen" class="hidden">
        <button onclick="disconnect()" style="float: right; background: red; margin-bottom: 10px;">Disconnect</button>
        <div id="terminal-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
